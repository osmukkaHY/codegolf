<!DOCTYPE HTML>
<html>

<head>
  {% if session.username %}
  <title>Main Page</title>
  {% else %}
  <title>Log In</title>
  {% endif %}
</head>

<body>
  {% if session.username %}
  <h1>Hello {{ session.username }}!</h1>
  <p><a href="/logout">Log Out</a></p>
  {% else %}
  <h1>Log In</h1>
  <form action="/login" method="post">
    <p>
      Username: <br />
      <input type="text" name="username" />
    </p>
    <p>
      Password: <br />
      <input type="password" name="password" />
    </p>
    <input type="submit" value="Log In" />
  </form>
  {% endif %}

</body>

</html>
