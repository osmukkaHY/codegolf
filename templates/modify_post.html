<html>

  <head>
    Modify post
  </head>

  <body>
    <form action="/posts/update/{{ post.id }}" method="POST">
      Title: <input type="text" name="title" value="{{ post.title }}"/> <br />
      Description: <br />
      <textarea name="description" rows=32 cols=40>{{ post.description }}</textarea> <br />
      <input type="submit" />
    </form>
  </body>

</html>
