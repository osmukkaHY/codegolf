{% extends "base.html" %}

{% block title %}New Challenge{% endblock %}

{% block header %}
  <h1>New Challenge</h1>
{% endblock %}

{% block content %}
  <form action="/posts/create" method="POST">
    Title: <input type="text" name="title" maxlength=128 value="{{ title_prefill }}" />
    Language: <select name="language">
      {% if not language_prefill %}
        <option value="" selected disabled hidden>Select...</option>
      {% endif %}
      {% for language in languages %}
        {% if language == language_prefill %}
          <option value="{{ language }}" selected >{{ language }}</option>
        {% else %}
          <option value="{{ language }}">{{ language }}</option>
        {% endif %}
      {% endfor %}
    </select>
    Categories: <select name="category">
      {% if not category_prefill %}
        <option value=""selected disabled hidden>Select...</option>
      {% endif %}
      {% for category in categories %}
        {% if category == category_prefill %}
          <option value="{{ category }}" selected>{{ category }}</option>
        {% else %}
          <option value="{{ category }}">{{ category }}</option>
        {% endif %}
      {% endfor %}
    </select> <br />
    Description: <br />
    <textarea name="description" rows=32 cols=40 maxlength=2048>{{ description_prefill }}</textarea> <br />
    <input type="submit" />
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  </form>
{% endblock %}
